name: Deploy Gymnasium website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate root website
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f assets/favicon.svg
          for page in sveden parents students news priem contacts styleguide; do
            test -f "${page}.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage only website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp ./*.html _site/
          cp -R assets/. _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
