name: Deploy static Gymnasium demo

on:
  push:
    branches: [main]
    paths: ["demo/**", "docs/**", "README.md", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
    paths: ["demo/**", "docs/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify static site structure
        run: |
          test -f demo/index.html
          test -f demo/assets/css/style.css
          test -f demo/assets/js/app.js
          for page in sveden parents students news priem contacts styleguide 404; do test -f "demo/$page.html"; done
          ! grep -R -n "build_demo.py" demo --exclude='README.md'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
