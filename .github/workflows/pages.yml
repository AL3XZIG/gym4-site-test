name: Build and deploy Gymnasium demo

on:
  push:
    branches: [main]
    paths: ["demo/**", "tests/**", "docs/**", "README.md", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
    paths: ["demo/**", "tests/**", "docs/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build demo
        run: |
          cd demo
          python build_demo.py
      - name: Test generated site
        run: python -m unittest discover -s tests -v
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
